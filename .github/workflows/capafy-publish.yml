name: Prepare Capafy Publication

on:
  workflow_dispatch:
    inputs:
      skill_dir:
        description: 'Skill directory to publish (for example: skills/obsidian)'
        required: true
        default: 'skills/obsidian'
      agent_id:
        description: 'Existing Agent ID for a version update; leave empty for a new Agent'
        required: false
      title:
        description: 'Listing title; leave empty to use the skill name'
        required: false
      description:
        description: 'Listing description; leave empty to use the skill description'
        required: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.validate.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install skills-ref
        run: pip install --quiet skills-ref

      - name: Validate selected skill
        id: validate
        env:
          SKILL_DIR: ${{ inputs.skill_dir }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from skills_ref.validator import validate

          skill = Path(os.environ["SKILL_DIR"])
          if not skill.is_dir():
              raise SystemExit(f"Skill directory not found: {skill}")

          errors = validate(skill)
          if errors:
              print(f"FAIL {skill.name}:")
              for error in errors:
                  print(f"  - {error}")
              raise SystemExit(1)

          print(f"OK {skill.name}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("passed=true\n")
          PY

  prepare:
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.passed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Capafy Publisher
        run: |
          curl --fail --silent --show-error --location \
            "https://api.capafy.ai/public/capafy-publisher.zip" \
            --output "$RUNNER_TEMP/capafy-publisher.zip"
          unzip -q "$RUNNER_TEMP/capafy-publisher.zip" -d "$RUNNER_TEMP"

      - name: Check publisher version
        working-directory: ${{ runner.temp }}/capafy-publisher
        run: python3 self_update.py --check

      - name: Create Capafy draft and review URL
        working-directory: ${{ runner.temp }}/capafy-publisher
        env:
          CAPAFY_ACCESS_TOKEN: ${{ secrets.CAPAFY_ACCESS_TOKEN }}
          WORKSPACE: ${{ github.workspace }}
          SKILL_DIR: ${{ inputs.skill_dir }}
          AGENT_ID: ${{ inputs.agent_id }}
          TITLE: ${{ inputs.title }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          export CAPAFY_ACCESS_TOKEN
          python3 packager.py publish-init \
            --env claude_code \
            --runtime-dir "$WORKSPACE" \
            --skill-dir "$WORKSPACE/$SKILL_DIR" \
            > discovery.json

          python3 - <<'PY'
          import json
          import os

          discovery = json.load(open("discovery.json"))
          if not discovery.get("ok") or discovery.get("status") != "needs_selection":
              raise SystemExit("Capafy did not return a selectable skill candidate")

          skills = discovery.get("skills", [])
          if len(skills) != 1:
              raise SystemExit(f"Expected one explicit skill candidate, found {len(skills)}")

          selections = {"skills": [{"path": skills[0]["path"], "selection": "selected"}]}
          if os.environ["AGENT_ID"]:
              selections["agent_id"] = os.environ["AGENT_ID"]
          if os.environ["TITLE"]:
              selections["title"] = os.environ["TITLE"]
          if os.environ["DESCRIPTION"]:
              selections["description"] = os.environ["DESCRIPTION"]

          with open("confirmed-selections.json", "w") as output:
              json.dump(selections, output)
          PY

          command=(python3 packager.py publish-init
            --env claude_code
            --runtime-dir "$WORKSPACE"
            --skill-dir "$WORKSPACE/$SKILL_DIR"
            --selections-file confirmed-selections.json)
          if [ -n "$AGENT_ID" ]; then
            command+=(--agent-id "$AGENT_ID")
          fi
          "${command[@]}" > result.json

          python3 - <<'PY'
          import json
          import os

          result = json.load(open("result.json"))
          if not result.get("ok") or result.get("status") != "submitted":
              raise SystemExit("Capafy did not create a publication draft")

          review_url = result.get("review_url")
          if not review_url:
              raise SystemExit("Capafy did not return the required review URL")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Capafy draft created\n\n")
              summary.write(f"Complete the required review at: {review_url}\n")
              summary.write(f"\nAgent ID: `{result.get('agent_id', '')}`\n")
              summary.write(f"\nVersion ID: `{result.get('agent_version_id', '')}`\n")
          PY
