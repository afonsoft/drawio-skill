name: Skills Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-spec:
    name: Validate Spec (skills-ref)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install skills-ref
        run: pip install --quiet skills-ref

      - name: Validate all skills
        run: |
          python - <<'PY'
          from pathlib import Path
          from skills_ref.validator import validate

          failures = 0
          for skill in sorted(Path("skills").glob("*/")):
              errors = validate(skill)
              if not errors:
                  print(f"OK   {skill.name}")
                  continue

              failures += 1
              print(f"FAIL {skill.name}:")
              for error in errors:
                  print(f"  - {error}")

          if failures:
              raise SystemExit(f"{failures} skill(s) failed spec validation")
          PY

  validate-quality:
    name: Validate Quality (skill-validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install skill-validator
        run: go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@latest

      - name: Validate skills
        env:
          PATH: ${{ env.PATH }}:$(go env GOPATH)/bin
        run: |
          skill-validator check --strict --emit-annotations skills/
          skill-validator check --strict -o markdown skills/ >> "$GITHUB_STEP_SUMMARY"

  security-scan:
    name: Security Scan (Snyk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      - name: Run Snyk test
        run: snyk test --all-projects --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Snyk Code test
        run: snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true